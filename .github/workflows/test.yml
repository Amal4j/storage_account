name: Terraform Azure Deployment

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:  
jobs:

  # JOB 1
  terraform-check:
    runs-on: ubuntu-latest

    # defaults:
    #   run:
    #     working-directory: ./Terraform_code

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan


  # JOB 2
  terraform-deploy:
    needs: terraform-check
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./Terraform_code

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan

      - name: Terraform Apply
        run: terraform apply -auto-approve
